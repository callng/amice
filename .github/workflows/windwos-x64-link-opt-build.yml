name: Windows X64 Build (opt-link)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'scripts/*windows.ps1'
      - '.github/workflows/windwos-x64-link-opt-build.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-build:
    name: "LLVM ${{ matrix.llvm }} Windows / opt"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        llvm: [18, 19, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: VM profile unit tests
        run: cargo test --locked -p amice-vm
      - name: Cache complete LLVM toolchain
        uses: actions/cache@v4
        with:
          path: .local/toolchains
          key: windows-plugin-llvm${{ matrix.llvm }}-v1
      - name: Build opt-linked plugin and run C/C++ smoke tests
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Setup -LlvmMajor ${{ matrix.llvm }} -LinkHost opt -SmokeTest
      - name: Upload amice.dll
        uses: actions/upload-artifact@v4
        with:
          name: libamice-llvm${{ matrix.llvm }}-windows-x86_64-link-opt
          path: target/windows-llvm${{ matrix.llvm }}-opt/x86_64-pc-windows-msvc/release/amice.dll
          if-no-files-found: error
          retention-days: 30
